name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev]"
      - name: Corpus regenerates identically and passes its checks
        run: |
          node corpus/generate-corpus.mjs
          git diff --exit-code -- corpus
          node corpus/check-corpus.mjs
      - name: Tests (in-memory store and a real Postgres with pgvector)
        run: pytest -q
      - name: Leakage sweep
        run: raglab sweep
